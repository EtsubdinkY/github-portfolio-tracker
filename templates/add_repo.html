{% extends "base.html" %}

{% block content %}
<h1>Add GitHub Repository</h1>

<div class="card">
    <form method="POST">
        <label>Owner:</label>
        <input type="text" name="owner" placeholder="EtsubdinkY" required>

        <label>Repository Name:</label>
        <input type="text" name="repo_name" placeholder="github-portfolio-tracker" required>

        <button class="btn" type="submit">Add Repository</button>
    </form>
</div>
{% endblock %}
